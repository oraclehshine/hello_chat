spring:
  application:
    name: hello-chat-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/hello_chat
    username: postgres
    password: wang5874579%
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
  kafka:
    bootstrap-servers: localhost:9092
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    baselineOnMigrate: true
    validateOnMigrate: true
    locations: classpath:db/migration

server:
  port: 8083

hello-chat:
  auth:
    secret: hello-chat-local-development-secret
    access-token-seconds: 7200
  moderation:
    admin-user-ids: 1

aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: hello-chat-im
    public-url-prefix: https://hello-chat-im.oss-cn-hangzhou.aliyuncs.com/

logging:
  level:
    root: info
    com.hellochat: debug
