spring:
  application:
    name: hello-chat-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hello_chat}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:wang5874579%}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    baselineOnMigrate: true
    validateOnMigrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}

hello-chat:
  auth:
    secret: ${HELLO_CHAT_AUTH_SECRET:hello-chat-local-development-secret}
    access-token-seconds: ${HELLO_CHAT_ACCESS_TOKEN_SECONDS:7200}
  moderation:
    admin-user-ids: ${HELLO_CHAT_ADMIN_USER_IDS:1}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:hello-chat-im}
    public-url-prefix: ${ALIYUN_OSS_PUBLIC_URL_PREFIX:https://hello-chat-im.oss-cn-hangzhou.aliyuncs.com/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: info
    com.hellochat: debug
